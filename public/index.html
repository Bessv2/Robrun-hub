<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Clan Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23c8f03c'/%3E%3Ctext x='16' y='22' font-family='Arial' font-style='italic' font-weight='900' font-size='15' text-anchor='middle' fill='%23141600'%3ECH%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/fira-sans-extra-condensed-latin-900-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell" id="shell" hidden>
    <aside class="side" id="side">
      <div class="brand">
        <span class="mark" aria-hidden="true">CH</span>
        <span class="brand-text"><b>CLAN HUB</b><small id="brand-sub">ROB RUN</small></span>
        <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="side-body" aria-label="Menu">☰</button>
      </div>
      <div class="side-body" id="side-body">
        <div class="me-card" id="me-card"></div>
        <nav aria-label="Sections">
          <p class="nav-label">Clan</p>
          <a href="#overview" data-page="overview">Overview</a>
          <a href="#shipments" data-page="shipments">Shipments <span class="count" id="nav-ship"></span></a>
          <a href="#plan" data-page="plan">Wipe planner</a>
          <p class="nav-label">Economy</p>
          <a href="#money" data-page="money">Money</a>
          <a href="#items" data-page="items">Items <span class="count" id="nav-items"></span></a>
          <p class="nav-label">Tools</p>
          <a href="#raids" data-page="raids">Raid alerts</a>
        </nav>
        <p class="side-foot">Game data and icons via robrun.info, a fan site. Game art belongs to its developer.</p>
      </div>
    </aside>
    <main class="main" id="view"><p class="muted">Loading…</p></main>
  </div>
  <div id="login"></div>
  <aside class="drawer" id="drawer" hidden aria-live="polite"></aside>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
